{{- if .Values.consolePlugin.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-console-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-plugin
{{- end }}
