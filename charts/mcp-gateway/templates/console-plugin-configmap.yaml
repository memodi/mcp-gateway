{{- if .Values.consolePlugin.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-console-plugin-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-plugin
data:
  nginx.conf: |
    error_log /dev/stdout info;
    events {}
    http {
      access_log /dev/stdout;
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      server {
        listen {{ .Values.consolePlugin.service.port }} ssl;
        ssl_certificate /var/serving-cert/tls.crt;
        ssl_certificate_key /var/serving-cert/tls.key;
        root /usr/share/nginx/html;

        # proxy status to broker service (for server list)
        location /status {
          proxy_pass http://{{ include "mcp-gateway.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:8080/status;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # proxy MCP requests to Gateway route (goes through ext_proc for session management)
        location /mcp {
          proxy_pass https://{{ .Values.gateway.publicHost }}/mcp;
          proxy_ssl_verify off;
          proxy_set_header Host {{ .Values.gateway.publicHost }};
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_buffering off;
          proxy_cache off;
        }

        location / {
          try_files $uri $uri/ /index.html;
        }
        location /plugin-manifest.json {
          default_type application/json;
        }
      }
    }
{{- end }}
