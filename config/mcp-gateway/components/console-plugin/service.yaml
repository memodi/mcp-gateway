---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway-console-plugin
  namespace: mcp-system
  labels:
    app: mcp-gateway-console-plugin
    app.kubernetes.io/name: mcp-gateway-console-plugin
    app.kubernetes.io/component: console-plugin
    app.kubernetes.io/part-of: mcp-gateway
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: mcp-gateway-console-plugin-cert
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 9443
      targetPort: 9443
      protocol: TCP
  selector:
    app: mcp-gateway-console-plugin
